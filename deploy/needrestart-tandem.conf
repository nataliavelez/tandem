# Installed by deploy/setup.sh and update.sh as /etc/needrestart/conf.d/tandem.conf.
# Ubuntu's automatic security updates run needrestart, which restarts services
# that use an updated library. Restarting the game server ends every session in
# progress (it did on 2026-11-13 at 06:15 UTC), so never restart the Tandem
# services automatically: updated libraries take effect at the next deliberate
# restart (deploy/update.sh, or systemctl restart between sessions).
$nrconf{override_rc}{qr(^tandem-(server|sidecar)\.service$)} = 0;
